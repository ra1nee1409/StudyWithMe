<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
  <!-- ==================== ADMIN HEADER COMPONENT ==================== -->
  <header th:fragment="admin-header" class="fixed top-0 left-72 right-0 h-16 bg-surface-card/90 backdrop-blur-xl shadow-sm z-40 flex items-center justify-between px-6 border-b border-surface-container/30">
    <div class="flex items-center gap-2 text-sm">
      <span class="material-symbols-outlined text-secondary text-[20px]">home</span>
      <span class="text-outline-variant">/</span>
      <span class="text-on-surface-variant">Hệ thống Quản trị</span>
      <span class="text-outline-variant">/</span>
      <span class="text-primary font-semibold">Bảng điều khiển thực tế</span>
    </div>

    <div class="flex items-center gap-4">
      <!-- Live Date Badge -->
      <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-surface-container-low text-xs text-on-surface-variant font-medium">
        <span class="material-symbols-outlined text-[16px] text-secondary">calendar_today</span>
        <span id="header-today-date">Đang cập nhật...</span>
      </div>

      <!-- User Profile Link -->
      <a th:href="@{/admin/profile}" title="Xem hồ sơ & đổi mật khẩu quản trị"
         class="flex items-center gap-2 px-2.5 py-1.5 rounded-xl hover:bg-surface-container transition-all group">
        <div id="admin-header-avatar" class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-on-primary font-bold text-xs shadow-xs group-hover:scale-105 transition-transform"
             th:text="${adminName != null and adminName.length() > 0 ? #strings.substring(adminName, 0, 1).toUpperCase() : 'A'}">
          A
        </div>
        <span class="text-xs font-semibold text-on-surface hidden md:inline group-hover:text-primary transition-colors"
              th:text="${adminName ?: 'Quản trị viên'}">Quản trị viên</span>
      </a>
    </div>

    <!-- Tự động cập nhật ngày tháng cho toàn bộ các trang Admin -->
    <script>
      (function initHeaderDate() {
        const update = () => {
          const dateEl = document.getElementById('header-today-date');
          if (dateEl) {
            const today = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'numeric', day: 'numeric' };
            dateEl.textContent = today.toLocaleDateString('vi-VN', options);
          }
        };
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', update);
        } else {
          update();
        }
      })();
    </script>
  </header>
</body>
</html>
