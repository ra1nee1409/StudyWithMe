<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{components/common/head :: common-head(${title})}"></head>
<body class="bg-background font-body-md text-body-md text-on-surface antialiased">

  <!-- HEADER COMPONENT -->
  <header th:replace="~{components/user/header :: main-header('register')}"></header>

  <main class="w-full pt-20 bg-background min-h-screen">
    <div class="relative w-full overflow-hidden py-8 lg:py-12 px-4 sm:px-6 lg:px-margin-desktop">
      <!-- Ambient glows -->
      <div class="absolute -top-32 -left-32 w-96 h-96 rounded-full bg-primary-container/10 blur-3xl pointer-events-none"></div>
      <div class="absolute top-1/2 -right-32 w-96 h-96 rounded-full bg-tertiary-container/10 blur-3xl pointer-events-none"></div>

      <div class="max-w-7xl mx-auto">
        <!-- Breadcrumb -->
        <div class="flex items-center gap-space-xs mb-6 text-on-surface-variant font-label-md text-label-md">
          <a class="hover:text-primary transition-colors flex items-center gap-1" th:href="@{/}">
            <span class="material-symbols-outlined text-[16px]">home</span> Trang chủ
          </a>
          <span class="material-symbols-outlined text-[14px]">chevron_right</span>
          <span class="text-primary font-bold">Đăng ký tài khoản</span>
        </div>

        <!-- Registration Card Container -->
        <div class="max-w-lg mx-auto w-full my-6">
          <div class="bg-surface-container-lowest rounded-xl p-6 sm:p-8 shadow-sm border border-surface-container">
            <div class="text-center mb-6">
              <h1 class="font-headline-lg text-headline-lg font-bold text-on-surface">Đăng ký tài khoản</h1>
              <p class="font-body-md text-body-md text-on-surface-variant mt-1.5">Tạo tài khoản StudyWithMe để bắt đầu học tập</p>
            </div>

            <!-- Role Switcher -->
            <div class="grid grid-cols-2 gap-2 p-1.5 bg-surface-container-low rounded-xl mb-6">
              <button class="flex items-center justify-center gap-2 py-2 px-3 rounded-lg bg-surface-container-lowest text-primary shadow-sm font-label-lg text-label-lg font-bold transition-all" id="role-student" onclick="setRole('student')" type="button">
                <span class="material-symbols-outlined text-[18px]">family_restroom</span>
                <span>Phụ huynh / Học viên</span>
              </button>
              <button class="flex items-center justify-center gap-2 py-2 px-3 rounded-lg text-on-surface-variant hover:text-primary font-label-lg text-label-lg transition-all" id="role-tutor" onclick="setRole('tutor')" type="button">
                <span class="material-symbols-outlined text-[18px]">co_present</span>
                <span>Gia sư</span>
              </button>
            </div>

            <!-- Alert Message Box -->
            <div id="alert-box" class="hidden mb-4 p-3 rounded-lg text-body-sm font-body-sm flex items-center gap-2"></div>

            <form class="flex flex-col gap-4" id="register-form" onsubmit="handleRegister(event)">
              <input type="hidden" id="dangKyLamGiangVien" name="dangKyLamGiangVien" value="false">

              <div>
                <label class="block font-label-lg text-label-lg text-on-surface font-semibold mb-1.5">
                  Họ và tên <span class="text-error">*</span>
                </label>
                <div class="relative">
                  <span class="material-symbols-outlined text-outline absolute left-3.5 top-1/2 -translate-y-1/2 text-[20px]">person</span>
                  <input class="w-full pl-11 pr-4 py-2.5 bg-surface-container-low rounded-lg text-body-md font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary-container transition-all" id="hoTen" name="hoTen" placeholder="Nhập họ và tên đầy đủ" required type="text">
                </div>
              </div>

              <div>
                <label class="block font-label-lg text-label-lg text-on-surface font-semibold mb-1.5">
                  Email <span class="text-error">*</span>
                </label>
                <div class="relative">
                  <span class="material-symbols-outlined text-outline absolute left-3.5 top-1/2 -translate-y-1/2 text-[20px]">mail</span>
                  <input class="w-full pl-11 pr-4 py-2.5 bg-surface-container-low rounded-lg text-body-md font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary-container transition-all" id="email" name="email" placeholder="example@gmail.com" required type="email">
                </div>
              </div>

              <div>
                <label class="block font-label-lg text-label-lg text-on-surface font-semibold mb-1.5">
                  Số điện thoại <span class="text-error">*</span>
                </label>
                <div class="relative">
                  <span class="material-symbols-outlined text-outline absolute left-3.5 top-1/2 -translate-y-1/2 text-[20px]">phone_iphone</span>
                  <input class="w-full pl-11 pr-4 py-2.5 bg-surface-container-low rounded-lg text-body-md font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary-container transition-all" id="soDienThoai" name="soDienThoai" placeholder="Nhập số điện thoại" required type="tel">
                </div>
              </div>

              <div>
                <label class="block font-label-lg text-label-lg text-on-surface font-semibold mb-1.5">
                  Mật khẩu <span class="text-error">*</span>
                </label>
                <div class="relative flex items-center">
                  <span class="material-symbols-outlined text-outline absolute left-3.5 pointer-events-none text-[20px]">lock</span>
                  <input class="w-full pl-11 pr-11 py-2.5 bg-surface-container-low rounded-lg text-body-md font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary-container transition-all" id="pwd" name="matKhau" placeholder="Tối thiểu 6 ký tự" required type="password">
                  <button class="absolute right-3 text-outline hover:text-primary cursor-pointer p-1 rounded-full transition-colors flex items-center justify-center" onclick="togglePass('pwd', this)" type="button" title="Hiển thị hoặc ẩn mật khẩu">
                    <span class="material-symbols-outlined text-[20px]">visibility_off</span>
                  </button>
                </div>
              </div>

              <div>
                <label class="block font-label-lg text-label-lg text-on-surface font-semibold mb-1.5">
                  Xác nhận mật khẩu <span class="text-error">*</span>
                </label>
                <div class="relative flex items-center">
                  <span class="material-symbols-outlined text-outline absolute left-3.5 pointer-events-none text-[20px]">lock_reset</span>
                  <input class="w-full pl-11 pr-11 py-2.5 bg-surface-container-low rounded-lg text-body-md font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary-container transition-all" id="pwd-confirm" placeholder="Nhập lại mật khẩu" required type="password">
                  <button class="absolute right-3 text-outline hover:text-primary cursor-pointer p-1 rounded-full transition-colors flex items-center justify-center" onclick="togglePass('pwd-confirm', this)" type="button" title="Hiển thị hoặc ẩn mật khẩu">
                    <span class="material-symbols-outlined text-[20px]">visibility_off</span>
                  </button>
                </div>
              </div>

              <div class="flex items-start gap-2.5 mt-1">
                <input checked class="mt-1 w-4 h-4 rounded text-primary-container focus:ring-primary-container border-outline-variant cursor-pointer" id="policy-terms" required type="checkbox">
                <label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer leading-tight" for="policy-terms">
                  Tôi đồng ý với <a class="text-primary hover:underline font-semibold" href="#">Điều khoản dịch vụ</a> và <a class="text-primary hover:underline font-semibold" href="#">Chính sách bảo mật</a>
                </label>
              </div>

              <button class="w-full mt-3 py-3 px-6 rounded-lg bg-primary hover:bg-on-secondary-container text-on-primary font-label-lg text-label-lg font-bold shadow-sm transition-all flex items-center justify-center gap-2" id="btn-submit" type="submit">
                <span>Đăng ký ngay</span>
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
              </button>
            </form>

            <div class="mt-6 pt-4 border-t border-surface-container text-center">
              <p class="font-body-md text-body-md text-on-surface-variant">
                Đã có tài khoản?
                <a class="font-bold text-primary hover:text-on-primary-container hover:underline ml-1" th:href="@{/login}">Đăng nhập</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER COMPONENT -->
  <footer th:replace="~{components/user/footer :: simple-footer}"></footer>

  <script>
    function togglePass(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('.material-symbols-outlined');
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility_off';
      }
    }

    function setRole(role) {
      const roleStudent = document.getElementById('role-student');
      const roleTutor = document.getElementById('role-tutor');
      const hiddenInput = document.getElementById('dangKyLamGiangVien');

      if (role === 'student') {
        roleStudent.className = "flex items-center justify-center gap-2 py-2 px-3 rounded-lg bg-surface-container-lowest text-primary shadow-sm font-label-lg text-label-lg font-bold transition-all";
        roleTutor.className = "flex items-center justify-center gap-2 py-2 px-3 rounded-lg text-on-surface-variant hover:text-primary font-label-lg text-label-lg transition-all";
        hiddenInput.value = "false";
      } else {
        roleTutor.className = "flex items-center justify-center gap-2 py-2 px-3 rounded-lg bg-surface-container-lowest text-primary shadow-sm font-label-lg text-label-lg font-bold transition-all";
        roleStudent.className = "flex items-center justify-center gap-2 py-2 px-3 rounded-lg text-on-surface-variant hover:text-primary font-label-lg text-label-lg transition-all";
        hiddenInput.value = "true";
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const pwd = document.getElementById('pwd').value;
      const pwdConfirm = document.getElementById('pwd-confirm').value;
      const alertBox = document.getElementById('alert-box');
      const btn = document.getElementById('btn-submit');

      if (pwd !== pwdConfirm) {
        alertBox.className = "mb-4 p-3 rounded-lg text-body-sm font-body-sm flex items-center gap-2 bg-error-container text-error";
        alertBox.innerHTML = '<span class="material-symbols-outlined text-[18px]">error</span><span>Mật khẩu xác nhận không khớp!</span>';
        alertBox.classList.remove('hidden');
        return;
      }

      const payload = {
        hoTen: document.getElementById('hoTen').value.trim(),
        email: document.getElementById('email').value.trim(),
        soDienThoai: document.getElementById('soDienThoai').value.trim(),
        matKhau: pwd,
        dangKyLamGiangVien: document.getElementById('dangKyLamGiangVien').value === 'true'
      };

      btn.disabled = true;
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">sync</span><span>Đang đăng ký...</span>';

      try {
        const response = await fetch('/api/auth/dang-ky', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (response.ok) {
          alertBox.className = "mb-4 p-3 rounded-lg text-body-sm font-body-sm flex items-center gap-2 bg-accent-cyan-subtle text-status-success";
          alertBox.innerHTML = '<span class="material-symbols-outlined text-[18px]">check_circle</span><span>' + (data.thongBao || data.message || 'Đăng ký thành công! Đang chuyển đến trang đăng nhập...') + '</span>';
          alertBox.classList.remove('hidden');
          setTimeout(() => {
            window.location.href = '/login';
          }, 1500);
        } else {
          alertBox.className = "mb-4 p-3 rounded-lg text-body-sm font-body-sm flex items-center gap-2 bg-error-container text-error";
          alertBox.innerHTML = '<span class="material-symbols-outlined text-[18px]">error</span><span>' + (data.thongBao || data.message || 'Đăng ký thất bại. Vui lòng thử lại!') + '</span>';
          alertBox.classList.remove('hidden');
          btn.disabled = false;
          btn.innerHTML = '<span>Đăng ký ngay</span><span class="material-symbols-outlined text-[20px]">arrow_forward</span>';
        }
      } catch (err) {
        alertBox.className = "mb-4 p-3 rounded-lg text-body-sm font-body-sm flex items-center gap-2 bg-error-container text-error";
        alertBox.innerHTML = '<span class="material-symbols-outlined text-[18px]">error</span><span>Lỗi kết nối máy chủ!</span>';
        alertBox.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = '<span>Đăng ký ngay</span><span class="material-symbols-outlined text-[20px]">arrow_forward</span>';
      }
    }
  </script>
</body>
</html>
