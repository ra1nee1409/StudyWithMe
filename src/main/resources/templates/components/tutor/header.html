<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
  <!-- ==================== TUTOR HEADER COMPONENT ==================== -->
  <header th:fragment="tutor-header" class="fixed top-0 left-72 right-0 h-16 bg-surface-card/90 backdrop-blur-xl shadow-sm z-40 flex items-center justify-between px-6 border-b border-surface-container/30">
    <div class="flex items-center gap-2 text-sm">
      <span class="material-symbols-outlined text-tertiary text-[20px]">school</span>
      <span class="text-outline-variant">/</span>
      <span class="text-on-surface-variant">Cổng Giảng Viên</span>
      <span class="text-outline-variant">/</span>
      <span class="text-tertiary-container font-semibold">Bàn làm việc giảng dạy</span>
    </div>

    <div class="flex items-center gap-4">
      <!-- Live Date Badge -->
      <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-surface-container-low text-xs text-on-surface-variant font-medium">
        <span class="material-symbols-outlined text-[16px] text-tertiary">calendar_today</span>
        <span id="tutor-header-today-date">Đang cập nhật...</span>
      </div>
      <!-- Tutor Avatar -->
      <div id="tutor-header-avatar" class="w-8 h-8 rounded-full bg-tertiary-container flex items-center justify-center text-white font-bold text-xs shadow-xs"
           th:text="${tutorName != null and tutorName.length() > 0 ? #strings.substring(tutorName, 0, 1).toUpperCase() : 'G'}">
        G
      </div>
    </div>

    <script>
      (function initTutorHeaderDate() {
        const update = () => {
          const dateEl = document.getElementById('tutor-header-today-date');
          if (dateEl) {
            const today = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'numeric', day: 'numeric' };
            dateEl.textContent = today.toLocaleDateString('vi-VN', options);
          }
        };
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', update);
        } else {
          update();
        }
      })();
    </script>
  </header>
</body>
</html>
