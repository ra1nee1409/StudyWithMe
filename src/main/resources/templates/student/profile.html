<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{components/common/head :: common-head('Hồ sơ học viên - StudyWithMe')}"></head>

<body class="bg-surface-canvas font-body-md text-on-surface antialiased">

  <!-- ==================== STUDENT SIDEBAR ==================== -->
  <aside th:replace="~{components/student/sidebar :: student-sidebar('profile')}"></aside>

  <!-- ==================== MAIN CONTENT ==================== -->
  <div class="pl-72">
    <!-- Top Header Bar -->
    <header th:replace="~{components/student/header :: student-header}"></header>

    <!-- Page Body -->
    <main class="relative pt-20 px-8 pb-12 bg-surface-canvas min-h-screen flex flex-col gap-6">

      <section class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-surface-card p-6 rounded-2xl shadow-sm border border-surface-container/40">
        <div>
          <h1 class="text-2xl font-bold text-on-surface tracking-tight">Hồ Sơ Học Viên & Tài Khoản</h1>
          <p class="text-xs text-on-surface-variant">Quản lý thông tin học tập, mục tiêu điểm số và bảo mật tài khoản của bạn.</p>
        </div>
      </section>

      <!-- Flash Notification Message -->
      <div th:if="${message}" class="p-4 rounded-xl bg-status-success/10 border border-status-success/30 text-status-success flex items-center gap-3 shadow-sm">
        <span class="material-symbols-outlined text-[22px]">check_circle</span>
        <span class="text-sm font-semibold" th:text="${message}"></span>
      </div>

      <div th:if="${errorMessage}" class="p-4 rounded-xl bg-error-container/20 border border-error/40 text-error flex items-center gap-3 shadow-sm">
        <span class="material-symbols-outlined text-[22px]">error</span>
        <span class="text-sm font-semibold" th:text="${errorMessage}"></span>
      </div>

      <div th:if="${passwordSuccessMessage}" class="p-4 rounded-xl bg-status-success/10 border border-status-success/30 text-status-success flex items-center gap-3 shadow-sm">
        <span class="material-symbols-outlined text-[22px]">lock_reset</span>
        <span class="text-sm font-semibold" th:text="${passwordSuccessMessage}"></span>
      </div>

      <div th:if="${passwordErrorMessage}" class="p-4 rounded-xl bg-error-container/20 border border-error/40 text-error flex items-center gap-3 shadow-sm">
        <span class="material-symbols-outlined text-[22px]">warning</span>
        <span class="text-sm font-semibold" th:text="${passwordErrorMessage}"></span>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Cột 1: Thông tin học sinh -->
        <div class="lg:col-span-2 bg-surface-card rounded-2xl shadow-sm border border-surface-container/40 p-6 space-y-6">
          <h2 class="text-base font-bold text-on-surface pb-3 border-b border-surface-container/40">Thông Tin Cá Nhân</h2>
          
          <form th:action="@{/student/profile/cap-nhat}" method="post" class="space-y-4 text-xs">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block font-bold text-on-surface mb-1">Họ và tên học sinh <span class="text-error">*</span></label>
                <input type="text" name="hoTen" required th:value="${currentUser != null && currentUser.hoTen != null ? currentUser.hoTen : studentName}" placeholder="Nhập họ và tên học sinh" class="w-full px-3 py-2 rounded-lg bg-surface-container-low border border-surface-container focus:outline-none focus:ring-1 focus:ring-primary font-semibold">
              </div>
              <div>
                <label class="block font-bold text-on-surface mb-1">Email đăng nhập (Không thể thay đổi)</label>
                <input type="email" th:value="${currentUser != null ? currentUser.email : studentEmail}" readonly disabled class="w-full px-3 py-2 rounded-lg bg-surface-container-low/60 border border-surface-container text-on-surface-variant cursor-not-allowed">
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block font-bold text-on-surface mb-1">Số điện thoại liên hệ</label>
                <input type="tel" name="soDienThoai" th:value="${currentUser != null ? currentUser.soDienThoai : ''}" placeholder="Nhập số điện thoại liên hệ" class="w-full px-3 py-2 rounded-lg bg-surface-container-low border border-surface-container focus:outline-none focus:ring-1 focus:ring-primary">
              </div>
              <div>
                <label class="block font-bold text-on-surface mb-1">Đường dẫn ảnh đại diện (Avatar URL)</label>
                <input type="url" name="anhDaiDien" th:value="${currentUser != null ? currentUser.anhDaiDien : ''}" placeholder="https://example.com/avatar.jpg" class="w-full px-3 py-2 rounded-lg bg-surface-container-low border border-surface-container focus:outline-none focus:ring-1 focus:ring-primary">
              </div>
            </div>

            <div class="pt-3 border-t border-surface-container/40 flex items-center justify-end">
              <button type="submit" class="px-5 py-2.5 rounded-xl bg-primary text-white text-xs font-bold hover:bg-primary-container shadow-sm transition-all cursor-pointer">
                Lưu Thay Đổi
              </button>
            </div>
          </form>
        </div>

        <!-- Cột 2: Đổi mật khẩu -->
        <div class="bg-surface-card rounded-2xl shadow-sm border border-surface-container/40 p-6 space-y-4">
          <h2 class="text-base font-bold text-on-surface pb-3 border-b border-surface-container/40">Bảo Mật Tài Khoản</h2>
          <form th:action="@{/student/profile/doi-mat-khau}" method="post" class="space-y-3 text-xs">
            <div>
              <label class="block font-bold text-on-surface mb-1">Mật khẩu hiện tại</label>
              <input type="password" name="matKhauHienTai" required class="w-full px-3 py-2 rounded-lg bg-surface-container-low border border-surface-container focus:outline-none focus:ring-1 focus:ring-primary">
            </div>
            <div>
              <label class="block font-bold text-on-surface mb-1">Mật khẩu mới (tối thiểu 6 ký tự)</label>
              <input type="password" name="matKhauMoi" required minlength="6" class="w-full px-3 py-2 rounded-lg bg-surface-container-low border border-surface-container focus:outline-none focus:ring-1 focus:ring-primary">
            </div>
            <div>
              <label class="block font-bold text-on-surface mb-1">Nhập lại mật khẩu mới</label>
              <input type="password" name="xacNhanMatKhau" required minlength="6" class="w-full px-3 py-2 rounded-lg bg-surface-container-low border border-surface-container focus:outline-none focus:ring-1 focus:ring-primary">
            </div>
            <button type="submit" class="w-full py-2.5 rounded-xl bg-surface-container text-on-surface font-bold hover:bg-surface-container-high transition-all mt-2 cursor-pointer">
              Đổi Mật Khẩu
            </button>
          </form>
        </div>
      </div>

    </main>
  </div>

</body>
</html>
