<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{components/common/head :: common-head('Hồ sơ học viên - StudyWithMe')}"></head>

<body class="bg-surface-canvas font-body-md text-on-surface antialiased">

  <!-- ==================== STUDENT SIDEBAR ==================== -->
  <aside th:replace="~{components/student/sidebar :: student-sidebar('profile')}"></aside>

  <!-- ==================== MAIN CONTENT ==================== -->
  <div class="pl-72">
    <!-- Top Header Bar -->
    <header th:replace="~{components/student/header :: student-header}"></header>

    <!-- Page Body -->
    <main class="relative pt-20 px-8 pb-12 bg-surface-canvas min-h-screen flex flex-col gap-6">

      <section class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-surface-card p-6 rounded-2xl shadow-sm border border-surface-container/40">
        <div>
          <h1 class="text-2xl font-bold text-on-surface tracking-tight">Hồ Sơ Học Viên & Tài Khoản</h1>
          <p class="text-xs text-on-surface-variant">Quản lý thông tin học tập, mục tiêu điểm số và bảo mật tài khoản của bạn.</p>
        </div>
      </section>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Cột 1: Thông tin học sinh -->
        <div class="lg:col-span-2 bg-surface-card rounded-2xl shadow-sm border border-surface-container/40 p-6 space-y-6">
          <h2 class="text-base font-bold text-on-surface pb-3 border-b border-surface-container/40">Thông Tin Cá Nhân</h2>
          
          <form onsubmit="event.preventDefault(); alert('Đã cập nhật thông tin học viên thành công!');" class="space-y-4 text-xs">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block font-bold text-on-surface mb-1">Họ và tên học sinh</label>
                <input type="text" th:value="${studentName ?: 'Nguyễn Văn Be'}" class="w-full px-3 py-2 rounded-lg bg-surface-container-low border border-surface-container focus:outline-none focus:ring-1 focus:ring-primary font-semibold">
              </div>
              <div>
                <label class="block font-bold text-on-surface mb-1">Email đăng nhập</label>
                <input type="email" th:value="${studentEmail ?: 'nguyenvanbe@test.com'}" readonly class="w-full px-3 py-2 rounded-lg bg-surface-container-low/60 border border-surface-container text-on-surface-variant cursor-not-allowed">
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block font-bold text-on-surface mb-1">Số điện thoại liên hệ</label>
                <input type="tel" value="0987654321" class="w-full px-3 py-2 rounded-lg bg-surface-container-low border border-surface-container focus:outline-none focus:ring-1 focus:ring-primary">
              </div>
              <div>
                <label class="block font-bold text-on-surface mb-1">Khối lớp / Trình độ</label>
                <select class="w-full px-3 py-2 rounded-lg bg-surface-container-low border border-surface-container focus:outline-none focus:ring-1 focus:ring-primary">
                  <option selected>Lớp 12 (Ôn thi THPT Quốc Gia)</option>
                  <option>Lớp 11</option>
                  <option>Lớp 10</option>
                  <option>Lớp 9 (Luyện thi vào 10)</option>
                  <option>Sinh viên / Người đi làm</option>
                </select>
              </div>
            </div>

            <div>
              <label class="block font-bold text-on-surface mb-1">Trường học hiện tại</label>
              <input type="text" value="THPT Chuyên Hà Nội - Amsterdam" class="w-full px-3 py-2 rounded-lg bg-surface-container-low border border-surface-container focus:outline-none focus:ring-1 focus:ring-primary">
            </div>

            <div>
              <label class="block font-bold text-on-surface mb-1">Mục tiêu học tập</label>
              <input type="text" value="Đạt 9.0+ Toán, 8.5+ Lý trong kỳ thi Tốt Nghiệp THPT và xét tuyển Đại học Bách Khoa" class="w-full px-3 py-2 rounded-lg bg-surface-container-low border border-surface-container focus:outline-none focus:ring-1 focus:ring-primary">
            </div>

            <div class="pt-3 border-t border-surface-container/40 flex items-center justify-end">
              <button type="submit" class="px-5 py-2.5 rounded-xl bg-primary text-white text-xs font-bold hover:bg-primary-container shadow-sm transition-all">
                Lưu Thay Đổi
              </button>
            </div>
          </form>
        </div>

        <!-- Cột 2: Đổi mật khẩu -->
        <div class="bg-surface-card rounded-2xl shadow-sm border border-surface-container/40 p-6 space-y-4">
          <h2 class="text-base font-bold text-on-surface pb-3 border-b border-surface-container/40">Bảo Mật Tài Khoản</h2>
          <form onsubmit="event.preventDefault(); alert('Đã đổi mật khẩu thành công!');" class="space-y-3 text-xs">
            <div>
              <label class="block font-bold text-on-surface mb-1">Mật khẩu hiện tại</label>
              <input type="password" required class="w-full px-3 py-2 rounded-lg bg-surface-container-low border border-surface-container focus:outline-none focus:ring-1 focus:ring-primary">
            </div>
            <div>
              <label class="block font-bold text-on-surface mb-1">Mật khẩu mới</label>
              <input type="password" required class="w-full px-3 py-2 rounded-lg bg-surface-container-low border border-surface-container focus:outline-none focus:ring-1 focus:ring-primary">
            </div>
            <div>
              <label class="block font-bold text-on-surface mb-1">Nhập lại mật khẩu mới</label>
              <input type="password" required class="w-full px-3 py-2 rounded-lg bg-surface-container-low border border-surface-container focus:outline-none focus:ring-1 focus:ring-primary">
            </div>
            <button type="submit" class="w-full py-2.5 rounded-xl bg-surface-container text-on-surface font-bold hover:bg-surface-container-high transition-all mt-2">
              Đổi Mật Khẩu
            </button>
          </form>
        </div>
      </div>

    </main>
  </div>

</body>
</html>
