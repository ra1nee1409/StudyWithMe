<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
  <header th:fragment="main-header(activePage)" class="fixed top-0 left-0 w-full z-50 bg-surface-container-lowest/95 backdrop-blur-md shadow-[0_1px_8px_rgba(28,105,154,0.06)]">
    <div class="h-20 w-full max-w-[1720px] mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between gap-4">
      <!-- Logo -->
      <div class="flex items-center gap-space-md shrink-0">
        <a class="flex items-center gap-2.5 group" th:href="@{/}">
          <img th:src="@{/images/logo-icon.png}" src="/images/logo-icon.png" alt="StudyWithMe Logo" class="h-10 w-10 object-contain transition-transform group-hover:scale-105">
          <img th:src="@{/images/logo-text.png}" src="/images/logo-text.png" alt="StudyWithMe" class="h-7 object-contain hidden sm:inline-block transition-opacity group-hover:opacity-90">
        </a>
      </div>

      <!-- Quick Search Bar (chỉ hiện trên màn hình rất lớn 2xl để không chiếm diện tích) -->
      <div class="hidden 2xl:flex items-center flex-1 max-w-xs relative shrink-0">
        <input class="w-full pl-9 pr-4 py-2 bg-surface-container-low rounded-full text-body-sm font-body-sm text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary-container transition-all" placeholder="Tìm môn học, gia sư hoặc lớp..." type="text">
        <span class="material-symbols-outlined text-outline absolute left-3 top-1/2 -translate-y-1/2 text-[18px]">search</span>
      </div>

      <!-- Main Navigation -->
      <nav class="hidden lg:flex items-center gap-1 xl:gap-2 shrink-0">
        <a class="px-3.5 py-2 rounded-lg font-label-lg text-label-lg whitespace-nowrap transition-colors"
           th:classappend="${activePage == 'courses'} ? 'text-primary font-bold bg-accent-cyan-subtle' : 'text-on-surface-variant hover:text-primary hover:bg-surface-container-low'"
           th:href="@{/khoa-hoc}">Khóa Học</a>
        <a class="px-3.5 py-2 rounded-lg font-label-lg text-label-lg whitespace-nowrap transition-colors"
           th:classappend="${activePage == 'tutors'} ? 'text-primary font-bold bg-accent-cyan-subtle' : 'text-on-surface-variant hover:text-primary hover:bg-surface-container-low'"
           th:href="@{/gia-su}">Tìm Gia Sư</a>
        <a class="px-3.5 py-2 rounded-lg text-on-surface-variant font-label-lg text-label-lg whitespace-nowrap hover:text-primary hover:bg-surface-container-low transition-colors"
           th:href="@{/#lop-1-kem-1}">Các Cấp Học</a>
        <a class="px-3.5 py-2 rounded-lg text-on-surface-variant font-label-lg text-label-lg whitespace-nowrap hover:text-primary hover:bg-surface-container-low transition-colors"
           th:href="@{/#gia-su}">Gia Sư Nổi Bật</a>
        <a class="px-3.5 py-2 rounded-lg font-label-lg text-label-lg whitespace-nowrap transition-colors"
           th:classappend="${activePage == 'tutor'} ? 'text-primary font-bold bg-accent-cyan-subtle' : 'text-on-surface-variant hover:text-primary hover:bg-surface-container-low'"
           th:href="@{/register}">Trở Thành Gia Sư</a>
      </nav>

      <!-- Auth & Actions -->
      <div class="flex items-center gap-2 sm:gap-3 shrink-0">
        <!-- Guest State (Shown when not logged in) -->
        <div id="nav-auth-guest" class="flex items-center gap-1 sm:gap-2 shrink-0">
          <a class="px-3.5 py-2 rounded-full font-label-lg text-label-lg whitespace-nowrap transition-colors"
             th:classappend="${activePage == 'login'} ? 'bg-accent-cyan-subtle text-primary font-bold' : 'text-secondary hover:text-on-primary-container hover:bg-accent-cyan-subtle'"
             th:href="@{/login}">Đăng nhập</a>
          <a class="hidden sm:inline-flex px-3.5 py-2 rounded-full font-label-lg text-label-lg whitespace-nowrap transition-colors"
             th:classappend="${activePage == 'register'} ? 'bg-accent-cyan-subtle text-primary font-bold' : 'text-secondary hover:text-on-primary-container hover:bg-accent-cyan-subtle'"
             th:href="@{/register}">Đăng ký</a>
        </div>

        <!-- Authenticated State (Shown dynamically when user session exists) -->
        <div id="nav-auth-user" class="hidden items-center gap-2 sm:gap-3 shrink-0">
          <!-- Admin Panel Button -->
          <a id="nav-admin-link" th:href="@{/admin}" class="hidden items-center gap-1.5 px-3.5 py-2 rounded-full bg-primary-container text-on-primary font-bold text-xs hover:opacity-90 shadow-xs whitespace-nowrap transition-all">
            <span class="material-symbols-outlined text-[16px]">admin_panel_settings</span>
            <span>Quản Trị</span>
          </a>
          <!-- Tutor Panel Button -->
          <a id="nav-tutor-link" th:href="@{/tutor/dashboard}" class="hidden items-center gap-1.5 px-3.5 py-2 rounded-full bg-tertiary-container text-white font-bold text-xs hover:opacity-90 shadow-xs whitespace-nowrap transition-all">
            <span class="material-symbols-outlined text-[16px]">school</span>
            <span>Cổng Giảng Viên</span>
          </a>
          <!-- Student Panel Button -->
          <a id="nav-student-link" th:href="@{/student/dashboard}" class="hidden items-center gap-1.5 px-3.5 py-2 rounded-full bg-primary text-white font-bold text-xs hover:opacity-90 shadow-xs whitespace-nowrap transition-all">
            <span class="material-symbols-outlined text-[16px]">space_dashboard</span>
            <span>Bàn Học Của Tôi</span>
          </a>
          <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface-container-low border border-surface-container shrink-0">
            <div id="nav-user-avatar" class="w-7 h-7 rounded-full bg-primary text-on-primary flex items-center justify-center font-bold text-xs">
              U
            </div>
            <span id="nav-user-name" class="font-bold text-xs text-on-surface max-w-[130px] truncate hidden sm:inline-block">
              Người dùng
            </span>
          </div>
          <button onclick="handleUserLogout()" type="button" title="Đăng xuất" class="w-8 h-8 rounded-full flex items-center justify-center text-error hover:bg-error-container/40 transition-colors shrink-0">
            <span class="material-symbols-outlined text-[18px]">logout</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Client-side Auth State Manager -->
    <script>
      (function checkUserAuthState() {
        try {
          const userStr = localStorage.getItem('studywithme_user');
          const token = localStorage.getItem('studywithme_token');
          if (userStr && token) {
            const user = JSON.parse(userStr);
            const guestBox = document.getElementById('nav-auth-guest');
            const userBox = document.getElementById('nav-auth-user');
            const nameEl = document.getElementById('nav-user-name');
            const avatarEl = document.getElementById('nav-user-avatar');
            const adminLink = document.getElementById('nav-admin-link');
            const tutorLink = document.getElementById('nav-tutor-link');
            const studentLink = document.getElementById('nav-student-link');

            if (guestBox && userBox) {
              guestBox.classList.add('hidden');
              userBox.classList.remove('hidden');
              userBox.classList.add('flex');

              if (user.hoTen) {
                if (nameEl) nameEl.textContent = user.hoTen;
                if (avatarEl) {
                  const firstLetter = user.hoTen.trim().charAt(0).toUpperCase();
                  avatarEl.textContent = firstLetter;
                }
              }

              const roles = user.roles || [];
              const hasRole = (roleTarget) => Array.isArray(roles) && roles.some(r => {
                const roleName = typeof r === 'string' ? r : (r.tenVaiTro || '');
                return roleName === roleTarget;
              });

              const isAdmin = hasRole('ROLE_QUAN_TRI');
              const isTutor = hasRole('ROLE_GIANG_VIEN');

              if (adminLink && isAdmin) {
                adminLink.classList.remove('hidden');
                adminLink.classList.add('inline-flex');
              }
              if (tutorLink && isTutor) {
                tutorLink.classList.remove('hidden');
                tutorLink.classList.add('inline-flex');
              }
              // Student link shows for any authenticated user
              if (studentLink) {
                studentLink.classList.remove('hidden');
                studentLink.classList.add('inline-flex');
              }
            }
          }
        } catch (err) {
          console.warn('Không thể đọc phiên người dùng:', err);
        }
      })();

      function handleUserLogout() {
        localStorage.removeItem('studywithme_token');
        localStorage.removeItem('studywithme_user');
        document.cookie = "studywithme_token=; path=/; max-age=0";
        window.location.href = '/login';
      }
    </script>
  </header>
</body>
</html>
