<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{components/common/head :: common-head(${title})}"></head>
<body class="bg-background font-body-md text-body-md text-on-surface antialiased">

  <!-- HEADER COMPONENT -->
  <header th:replace="~{components/user/header :: main-header('login')}"></header>

  <main class="w-full pt-20 bg-background min-h-screen">
    <div class="relative w-full overflow-hidden py-space-md lg:py-space-xl">
      <!-- Ambient glows -->
      <div class="pointer-events-none absolute -top-24 -left-20 w-96 h-96 rounded-full bg-accent-cyan-subtle/80 blur-3xl -z-10"></div>
      <div class="pointer-events-none absolute bottom-0 right-10 w-80 h-80 rounded-full bg-accent-coral-subtle/70 blur-3xl -z-10"></div>

      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-margin-desktop">
        <!-- Breadcrumb -->
        <div class="flex items-center gap-space-xs text-on-surface-variant font-label-md text-label-md mb-space-md">
          <a class="hover:text-primary transition-colors flex items-center gap-1" th:href="@{/}">
            <span class="material-symbols-outlined text-[16px]">home</span> Trang chủ
          </a>
          <span>/</span>
          <span class="text-primary font-bold">Đăng nhập tài khoản</span>
        </div>

        <!-- Login Container -->
        <div class="w-full max-w-md mx-auto my-space-lg">
          <div class="bg-surface-container-lowest rounded-xl p-6 sm:p-8 shadow-md border border-surface-container">
            <div class="text-center mb-space-lg">
              <h2 class="font-headline-lg text-headline-lg text-on-surface font-bold tracking-tight">Đăng nhập</h2>
              <p class="font-body-md text-body-md text-on-surface-variant mt-1">Nhập thông tin tài khoản StudyWithMe của bạn</p>
            </div>

            <!-- Role Selector -->
            <div class="p-1 rounded-lg bg-surface-container-low flex items-center mb-space-lg">
              <button class="flex-1 py-2 px-3 rounded-md font-label-md text-label-md transition-all flex items-center justify-center gap-1.5 bg-surface-container-lowest text-primary shadow-sm font-bold" id="tab-student" onclick="switchRole('student')" type="button">
                <span class="material-symbols-outlined text-[18px]">school</span>
                <span>Phụ huynh / Học viên</span>
              </button>
              <button class="flex-1 py-2 px-3 rounded-md font-label-md text-label-md transition-all flex items-center justify-center gap-1.5 text-on-surface-variant hover:text-primary font-medium" id="tab-tutor" onclick="switchRole('tutor')" type="button">
                <span class="material-symbols-outlined text-[18px]">person_apron</span>
                <span>Gia sư / Giáo viên</span>
              </button>
            </div>

            <!-- Alert message -->
            <div id="login-alert" class="hidden mb-4 p-3 rounded-lg text-body-sm font-body-sm flex items-center gap-2"></div>

            <form class="space-y-space-md" onsubmit="handleLoginSubmit(event)">
              <div class="space-y-1.5">
                <label class="block font-label-lg text-label-lg text-on-surface font-semibold" for="login-account">
                  Email đăng nhập
                </label>
                <div class="relative flex items-center">
                  <span class="material-symbols-outlined text-outline absolute left-3.5 pointer-events-none text-[20px]">account_circle</span>
                  <input class="w-full pl-11 pr-4 py-2.5 rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md shadow-sm border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary-container outline-none transition-all" id="login-account" name="account" placeholder="Ví dụ: admin@studywithme.vn" required type="email">
                </div>
              </div>

              <div class="space-y-1.5">
                <div class="flex items-center justify-between">
                  <label class="block font-label-lg text-label-lg text-on-surface font-semibold" for="login-password">
                    Mật khẩu
                  </label>
                  <a class="font-label-md text-label-md text-primary hover:text-on-primary-container font-semibold transition-colors" href="#">Quên mật khẩu?</a>
                </div>
                <div class="relative flex items-center">
                  <span class="material-symbols-outlined text-outline absolute left-3.5 pointer-events-none text-[20px]">lock</span>
                  <input class="w-full pl-11 pr-11 py-2.5 rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md shadow-sm border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary-container outline-none transition-all" id="login-password" name="password" placeholder="Nhập mật khẩu" required type="password">
                  <button aria-label="Hiển thị hoặc ẩn mật khẩu" class="absolute right-3.5 text-outline hover:text-primary p-1 rounded-full cursor-pointer transition-colors flex items-center justify-center" id="toggle-password-btn" onclick="togglePasswordVisibility()" type="button" title="Hiển thị hoặc ẩn mật khẩu">
                    <span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility_off</span>
                  </button>
                </div>
              </div>

              <div class="flex items-center justify-between pt-1">
                <label class="flex items-center gap-2 cursor-pointer select-none">
                  <input checked class="w-4 h-4 rounded text-primary focus:ring-primary-container accent-primary cursor-pointer" id="remember-me" name="remember" type="checkbox">
                  <span class="font-body-md text-body-md text-on-surface">Ghi nhớ đăng nhập</span>
                </label>
              </div>

              <div class="pt-space-xs">
                <button class="w-full py-3 px-6 rounded-full bg-tertiary-container text-on-tertiary font-label-lg text-label-lg font-bold shadow-lg hover:bg-tertiary hover:shadow-xl transition-all flex items-center justify-center gap-2 transform active:scale-[0.99]" id="submit-login-btn" type="submit">
                  <span class="material-symbols-outlined text-[20px]">login</span>
                  <span>Đăng nhập</span>
                </button>
              </div>
            </form>

            <div class="mt-space-lg pt-space-md text-center border-t border-surface-container">
              <p class="font-body-md text-body-md text-on-surface-variant">
                Chưa có tài khoản?
                <a class="text-primary hover:text-on-primary-container font-semibold transition-colors inline-flex items-center gap-1 ml-1" th:href="@{/register}">
                  <span>Đăng ký ngay</span>
                  <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
                </a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER COMPONENT -->
  <footer th:replace="~{components/user/footer :: simple-footer}"></footer>

  <script>
    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('login-password');
      const eyeIcon = document.getElementById('eye-icon');
      if (!pwdInput || !eyeIcon) return;

      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeIcon.textContent = 'visibility';
      } else {
        pwdInput.type = 'password';
        eyeIcon.textContent = 'visibility_off';
      }
    }

    function switchRole(role) {
      const studentTab = document.getElementById('tab-student');
      const tutorTab = document.getElementById('tab-tutor');
      const accountInput = document.getElementById('login-account');

      if (!studentTab || !tutorTab) return;

      if (role === 'student') {
        studentTab.className = "flex-1 py-2 px-3 rounded-md font-label-md text-label-md transition-all flex items-center justify-center gap-1.5 bg-surface-container-lowest text-primary shadow-sm font-bold";
        tutorTab.className = "flex-1 py-2 px-3 rounded-md font-label-md text-label-md transition-all flex items-center justify-center gap-1.5 text-on-surface-variant hover:text-primary font-medium";
        if (accountInput) accountInput.placeholder = "Ví dụ: phuhuynh@studywithme.vn";
      } else {
        tutorTab.className = "flex-1 py-2 px-3 rounded-md font-label-md text-label-md transition-all flex items-center justify-center gap-1.5 bg-surface-container-lowest text-primary shadow-sm font-bold";
        studentTab.className = "flex-1 py-2 px-3 rounded-md font-label-md text-label-md transition-all flex items-center justify-center gap-1.5 text-on-surface-variant hover:text-primary font-medium";
        if (accountInput) accountInput.placeholder = "Ví dụ: giasu@studywithme.vn";
      }
    }

    async function handleLoginSubmit(event) {
      event.preventDefault();
      const btn = document.getElementById('submit-login-btn');
      const alertBox = document.getElementById('login-alert');
      const email = document.getElementById('login-account').value.trim();
      const matKhau = document.getElementById('login-password').value;

      btn.disabled = true;
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">sync</span><span>Đang xác thực...</span>';

      try {
        const response = await fetch('/api/auth/dang-nhap', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, matKhau: matKhau })
        });

        const data = await response.json();
        const payload = data.duLieu || data.data;

        if (response.ok && payload && payload.accessToken) {
          const roles = payload.danhSachVaiTro || payload.roles || [];
          localStorage.setItem('studywithme_token', payload.accessToken);
          document.cookie = "studywithme_token=" + payload.accessToken + "; path=/; max-age=86400";
          localStorage.setItem('studywithme_user', JSON.stringify({
            userId: payload.id || payload.userId,
            hoTen: payload.hoTen,
            email: payload.email,
            roles: roles
          }));

          alertBox.className = "mb-4 p-3 rounded-lg text-body-sm font-body-sm flex items-center gap-2 bg-accent-cyan-subtle text-status-success";
          alertBox.innerHTML = '<span class="material-symbols-outlined text-[18px]">check_circle</span><span>Đăng nhập thành công! Đang chuyển hướng...</span>';
          alertBox.classList.remove('hidden');

          btn.classList.remove('bg-tertiary-container', 'hover:bg-tertiary');
          btn.classList.add('bg-status-success', 'text-on-primary');

          setTimeout(() => {
            if (roles.includes('ROLE_QUAN_TRI')) {
              window.location.href = '/admin';
            } else {
              window.location.href = '/';
            }
          }, 600);
        } else {
          alertBox.className = "mb-4 p-3 rounded-lg text-body-sm font-body-sm flex items-center gap-2 bg-error-container text-error";
          alertBox.innerHTML = '<span class="material-symbols-outlined text-[18px]">error</span><span>' + (data.thongBao || data.message || 'Email hoặc mật khẩu không chính xác!') + '</span>';
          alertBox.classList.remove('hidden');

          btn.disabled = false;
          btn.innerHTML = '<span class="material-symbols-outlined text-[20px]">login</span><span>Đăng nhập</span>';
        }
      } catch (err) {
        alertBox.className = "mb-4 p-3 rounded-lg text-body-sm font-body-sm flex items-center gap-2 bg-error-container text-error";
        alertBox.innerHTML = '<span class="material-symbols-outlined text-[18px]">error</span><span>Lỗi kết nối máy chủ!</span>';
        alertBox.classList.remove('hidden');

        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined text-[20px]">login</span><span>Đăng nhập</span>';
      }
    }
  </script>
</body>
</html>
